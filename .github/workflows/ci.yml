name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Restore
        run: dotnet restore DatumForge.slnx
      - name: Check formatting
        run: dotnet format DatumForge.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build DatumForge.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test DatumForge.slnx --configuration Release --no-build --collect:"XPlat Code Coverage"

  publish-windows:
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore Windows runtime assets
        run: dotnet restore src/DatumForge.App/DatumForge.App.csproj -r win-x64
      - name: Publish unsigned portable build
        run: dotnet publish src/DatumForge.App/DatumForge.App.csproj -c Release -r win-x64 --self-contained false --no-restore -o artifacts/win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: DatumForge-win-x64-unsigned
          path: artifacts/win-x64
          if-no-files-found: error
